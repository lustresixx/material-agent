[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "localdeck"
version = "0.1.0"
description = "Docker-free local Agent/MCP pipeline for editable PowerPoint generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.10,<2.14",
    "mcp>=1.14,<2",
    "openai>=1.108,<2",
    "playwright>=1.55,<2",
    "pydantic>=2.11,<3",
    "python-pptx>=1.0,<2",
    "pywin32>=308; sys_platform == 'win32'",
    "PyYAML>=6,<7",
    "rich>=13,<15",
    "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.400",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
]

[project.scripts]
localdeck = "localdeck.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["localdeck"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: calls the real GLM API"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["localdeck"]
