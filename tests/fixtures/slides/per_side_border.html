<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
    body { position: relative; font-family: "Microsoft YaHei", sans-serif; background: #f5f7fa; }
    h1 { position: absolute; left: 80px; top: 62px; margin: 0; font-size: 48px; color: #17233d; }
    .card {
      position: absolute; left: 150px; top: 190px; width: 980px; height: 350px;
      padding: 55px; background: #ffffff;
      border: 2px solid #aeb8ca; border-left: 14px solid #e60012;
    }
    .card p { margin: 0; font-size: 32px; line-height: 1.55; color: #26344f; }
  </style>
</head>
<body>
  <h1>一套规则，保持模板识别度</h1>
  <div class="card"><p>左侧品牌强调线与其余边框必须保留各自颜色和宽度。</p></div>
</body>
</html>
