<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
    body {
      position: relative;
      font-family: "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #06142f 0%, #123f88 58%, #087a9f 100%);
      color: #ffffff;
    }
    h1 { position: absolute; left: 80px; top: 72px; margin: 0; font-size: 54px; }
    .panel {
      position: absolute; left: 80px; top: 190px; width: 650px; height: 330px;
      padding: 38px; border-radius: 28px;
      background: rgba(255, 255, 255, 0.16);
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.28);
    }
    .panel p { margin: 0; font-size: 28px; line-height: 1.5; }
    svg { position: absolute; right: 100px; top: 215px; width: 320px; height: 260px; }
  </style>
</head>
<body>
  <h1>数智化合作新生态</h1>
  <div class="panel"><p>统一技术底座，连接科研创新与人才培养。</p></div>
  <svg viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg">
    <circle cx="160" cy="130" r="105" fill="#39d4ff" fill-opacity="0.28"/>
    <path d="M70 155 L135 85 L185 135 L250 65" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</body>
</html>
